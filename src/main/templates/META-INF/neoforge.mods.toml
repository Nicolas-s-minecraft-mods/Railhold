modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Nicolas-s-minecraft-mods/Railhold/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/Nicolas-s-minecraft-mods/Railhold"
logoFile = "railhold_logo.png"
logoBlur = false
# The mod list shows the translated description (key: fml.menu.mods.info.description.<mod_id>) when it exists.
description = '''${mod_description}'''

# Two linked minecarts do not push each other. A minecart in a train with a locomotive gets the speed cap of its train.
[[mixins]]
config = "railhold.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
